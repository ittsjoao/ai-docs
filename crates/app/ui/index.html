<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>screenManual</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <aside id="lateral" class="vidro">
      <div class="marca"><span class="orbe"></span><b>screenManual</b></div>
      <div id="acoes-gravacao"></div>
      <p class="rotulo">Gravações</p>
      <ul id="lista"></ul>
      <p class="rotulo">Outros</p>
      <button data-acao="config" class="nav"><span data-icone="settings"></span> Configurações</button>
    </aside>
    <main id="principal">
      <div id="faixa"></div>
      <section id="painel"></section>
    </main>
    <dialog id="titulo">
      <form data-form="titulo">
        <h3>O que você vai documentar?</h3>
        <input name="titulo" class="campo" required autofocus />
        <menu>
          <button type="button" data-acao="cancelar-titulo">Cancelar</button>
          <button value="ok" class="primario">● Gravar</button>
        </menu>
      </form>
    </dialog>
    <dialog id="pergunta">
      <p></p>
      <menu>
        <button value="nao">Não</button>
        <button value="sim" class="primario">Sim</button>
      </menu>
    </dialog>
    <dialog id="imagens">
      <h3 id="imagens-titulo">Imagem do passo</h3>
      <div id="galeria"></div>
      <label id="soltar" class="soltar">
        <span data-icone="upload"></span>
        Arraste um print aqui, <b>escolha um arquivo</b> ou cole com <b>Ctrl+V</b>
        <input type="file" id="arquivo" accept="image/png,image/jpeg" hidden />
      </label>
      <p class="dica">Imagens escolhidas aqui não passam pela revisão de dados sensíveis. Confira se não mostram senha ou dado de cliente.</p>
      <menu>
        <button value="sem"><span data-icone="image-off"></span> Sem imagem</button>
        <button value="fechar">Fechar</button>
      </menu>
    </dialog>
    <dialog id="zoom">
      <img id="zoom-img" alt="" />
      <div class="zoom-rodape"><span id="zoom-legenda"></span><button value="fechar"><span data-icone="x"></span> Fechar</button></div>
    </dialog>
    <dialog id="duvidas">
      <form data-form="duvidas">
        <h3>A IA tem dúvidas</h3>
        <div id="lista-duvidas"></div>
        <menu>
          <button type="button" data-acao="cancelar-perguntas">Cancelar</button>
          <button type="button" data-acao="pular">Pular</button>
          <button value="ok" class="primario">Responder</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
