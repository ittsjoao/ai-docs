name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/package-lock.json

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: instalador
        shell: pwsh
        run: ./scripts/build-instalador.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: screenManual-windows
          path: |
            target/release/screenManual.exe
            target/release/screenmanual-cli.exe
            target/release/bundle/nsis/*.exe

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
